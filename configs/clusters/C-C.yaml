# SYNTHETIC profile values (order-of-magnitude placeholders, NOT measurements).
# Per-slot throughput (work units/s) and per-slot loaded power (W); dynamic power = load - idle.
# sigma_protected: modelled slowdown for jobs requiring TEE capabilities (GPU 1.07 from the upper end of
# Zhu et al. 2024 H100 CC throughput overhead; CPU 1.10 is an assumption). See docs/assumptions.md.
# TEE-rich: 2 CPU CVM nodes, 2 standard CPU nodes, 2 confidential GPU nodes.
name: C-C
default_bandwidth_gbps: 10.0
nodes:
- id: cpu-tee-0
  cls: CPU
  capacity: 4
  memory_gb: 128
  capabilities: [ENC_AT_REST, ENC_IN_TRANSIT, TEE_CPU, ATTESTED]
  sigma_protected: 1.1
  power_idle_w: 60
  profile:
    prep: {throughput: 2.0, power_load_w: 95}
    infer_small: {throughput: 0.8, power_load_w: 100}
    infer_large: {throughput: 0.05, power_load_w: 105}
    finetune: {throughput: 0.02, power_load_w: 105}
    pipe_stage: {throughput: 1.0, power_load_w: 95}
- id: cpu-tee-1
  cls: CPU
  capacity: 4
